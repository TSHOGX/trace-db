[package]
name = "trace-db"
version = "0.1.0"
edition = "2021"
description = "A loss-aware, local archive and retrieval CLI for coding-agent traces"
license = "MIT"
repository = "https://github.com/TSHOGX/trace-db"
rust-version = "1.82"

[lib]
name = "tracedb"
path = "src/lib.rs"

[[bin]]
name = "trace-db"
path = "src/main.rs"

[[bin]]
name = "trace-db-bench"
path = "src/bin/trace-db-bench.rs"

[[bin]]
name = "trace-db-relevance"
path = "src/bin/trace-db-relevance.rs"

[workspace]
members = ["native/fts5-jieba", "bindings/python", "bindings/node"]
default-members = [".", "native/fts5-jieba"]
resolver = "2"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.4"
dirs = "6"
filetime = "0.2"
globset = "0.4"
hex = "0.4"
prost = "0.13"
rusqlite = { version = "0.32", features = ["bundled", "functions", "load_extension"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
toml = "0.8"
notify = "6.1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
walkdir = "2.5"
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
