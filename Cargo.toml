[package]
name = "trace-db"
version = "0.1.0"
edition = "2021"
description = "A loss-aware, local archive and retrieval CLI for coding-agent traces"
license = "MIT"
repository = "https://github.com/TSHOGX/trace-db"
rust-version = "1.83"

[lib]
name = "tracedb"
path = "src/lib.rs"

[[bin]]
name = "trace-db"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "trace-db-bench"
path = "src/bin/trace-db-bench.rs"
required-features = ["cli"]

[[bin]]
name = "trace-db-relevance"
path = "src/bin/trace-db-relevance.rs"
required-features = ["cli"]

[workspace]
members = ["native/fts5-jieba", "bindings/python", "bindings/node"]
default-members = [".", "native/fts5-jieba"]
resolver = "2"

# An embedder wants the store, facade, parsers, ingest, watch, search, and
# reconstruct without paying for a gRPC server or an argument parser. Both
# surfaces are additive to the core, and neither is referenced by it, so each
# is a feature rather than an unconditional cost.
[features]
default = ["cli", "grpc"]
# The versioned tracedb.v1 server, its generated types, and the proto build
# step. tokio is here rather than in the core because `service.rs` is its only
# user: nothing in the store, facade, parsers, or watch path is async.
grpc = [
  "dep:prost",
  "dep:tokio",
  "dep:tokio-stream",
  "dep:tonic",
  "dep:tonic-build",
  "dep:protoc-bin-vendored",
]
# The `trace-db` binaries. This enables `grpc` because `trace-db serve` is one
# of the CLI's commands, so a CLI without it would be a different CLI.
cli = ["grpc", "dep:clap", "dep:clap_complete", "dep:ctrlc"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
clap_complete = { version = "=4.5.47", optional = true }
ctrlc = { version = "3.4", optional = true }
dirs = "6"
filetime = "0.2"
globset = "=0.4.16"
hex = "0.4"
prost = { version = "0.13", optional = true }
rusqlite = { version = "0.32", features = ["bundled", "functions", "load_extension", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
toml = "0.8"
notify = "6.1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"], optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
tonic = { version = "0.12", features = ["transport"], optional = true }
walkdir = "2.5"
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[build-dependencies]
protoc-bin-vendored = { version = "3", optional = true }
tonic-build = { version = "0.12", optional = true }

# Integration suites that drive the `trace-db` binary or the gRPC server cannot
# compile without the target they exercise, so they declare it. The suites that
# mix library and CLI coverage gate the CLI test alone instead, keeping the
# library assertions runnable under `--no-default-features`.
[[test]]
name = "cli_ingest"
required-features = ["cli"]

[[test]]
name = "cli_json"
required-features = ["cli"]

[[test]]
name = "config"
required-features = ["cli"]

[[test]]
name = "daemon"
required-features = ["cli"]

[[test]]
name = "doctor"
required-features = ["cli"]

[[test]]
name = "grpc_api"
required-features = ["grpc"]

[dev-dependencies]
proptest = "=1.9.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
