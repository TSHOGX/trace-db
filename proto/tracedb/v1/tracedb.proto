syntax = "proto3";

package tracedb.v1;

// Stable, agent-neutral access to one local TraceDB archive.
service TraceDbService {
  // Discover native stores and transactionally ingest matching sessions.
  rpc Ingest(IngestRequest) returns (IngestResponse);
  // Search normalized events and return lineage-collapsed sessions.
  rpc Search(SearchRequest) returns (SearchResponse);
  // List archived sessions with stable cursor pagination and metadata filters.
  rpc List(ListRequest) returns (ListResponse);
  // Read one session's archive coverage without loading its event stream.
  rpc Coverage(CoverageRequest) returns (CoverageResponse);
  // Read one session and an optional normalized event range/kind subset.
  rpc Show(ShowRequest) returns (ShowResponse);
  // Read archive-wide and per-agent counts.
  rpc Stats(StatsRequest) returns (StatsResponse);
  // Rebuild the gated full-text index from normalized events.
  rpc Reindex(ReindexRequest) returns (ReindexResponse);
  // Restore full-capture sources below a server-local output directory.
  rpc Reconstruct(ReconstructRequest) returns (ReconstructResponse);
}

message IngestRequest {
  reserved 2;
  reserved "mode";
  repeated string agents = 1;
  optional string root = 3;
  optional int64 since_ms = 4;
}

message IngestResponse {
  repeated AgentIngestReport agents = 1;
  uint64 total_discovered = 2;
  uint64 total_ingested = 3;
  uint64 total_parsed = 4;
  uint64 total_unchanged = 5;
  uint64 total_skipped_by_since = 6;
  uint64 total_skipped = 7;
  uint64 total_failed = 8;
  uint64 total_warnings = 9;
  // Present when the ingest status was durably committed.  Clients may store
  // this acknowledgement as an ingestion watermark; it is independent of
  // source session timestamps such as ended_at_ms.
  IngestAck ack = 10;
}

message IngestAck {
  uint64 sequence = 1;
  int64 committed_at_ms = 2;
}

message AgentIngestReport {
  string agent = 1;
  string root = 2;
  uint64 discovered = 3;
  uint64 ingested = 4;
  uint64 skipped_by_since = 5;
  uint64 parsed = 6;
  uint64 unchanged = 7;
  uint64 skipped = 8;
  uint64 failed = 9;
  repeated IngestIssue warnings = 10;
  repeated IngestIssue failures = 11;
}

message IngestIssue {
  string stage = 1;
  string locator = 2;
  string category = 3;
  string message = 4;
}

message SearchRequest {
  string query = 1;
  uint32 limit = 2;
  optional string agent = 3;
  optional string cwd = 4;
  optional int64 since_ms = 5;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

message SearchResult {
  string id = 1;
  string agent = 2;
  optional string cwd = 3;
  int64 hits = 4;
  string lineage_root_id = 5;
  optional string title = 6;
  optional int64 started_at_ms = 7;
  optional int64 ended_at_ms = 8;
  double score = 9;
  ScoreBreakdown score_breakdown = 10;
  SearchMatch best_match = 11;
  optional string ask = 12;
  optional string outcome = 13;
  repeated string related_session_ids = 14;
}

message ScoreBreakdown {
  double best_match = 1;
  double hit_coverage = 2;
  double term_coverage = 3;
  double kind = 4;
  double recency = 5;
  double title = 6;
  double lineage = 7;
}

message SearchMatch {
  int64 event_idx = 1;
  string kind = 2;
  double bm25 = 3;
  string snippet = 4;
}

message ShowRequest {
  string id = 1;
  optional int64 from_idx = 2;
  optional int64 to_idx = 3;
  repeated string kinds = 4;
}

message ShowResponse {
  reserved 2;
  reserved "mode";
  optional Session session = 1;
  repeated Event events = 3;
  repeated Span spans = 4;
}

message Session {
  reserved 11;
  reserved "forked_from";
  string id = 1;
  string agent = 2;
  optional string cwd = 3;
  optional int64 started_at_ms = 4;
  optional int64 ended_at_ms = 5;
  optional string title = 6;
  optional string model = 7;
  optional string provider = 8;
  optional string git_branch = 9;
  optional string parent_session_id = 10;
  string meta_json = 12;
  string fingerprint = 13;
  repeated NativeSource sources = 14;
  optional string status = 15;
  optional string parent_relation = 16;
  optional string fork_point_native_id = 17;
}

message NativeSource {
  string locator = 1;
  string kind = 2;
  string restore_path = 3;
  optional string role = 4;
  optional int64 bytes = 5;
  optional int64 mtime_ns = 6;
  optional uint32 mode = 7;
}

message Event {
  int64 idx = 1;
  string kind = 2;
  optional string subtype = 3;
  optional string role = 4;
  optional string name = 5;
  optional string call_id = 6;
  optional bool is_error = 7;
  optional string native_id = 8;
  optional string parent_id = 9;
  optional string model = 10;
  optional string provider = 11;
  optional string usage_json = 12;
  string text = 13;
  optional string data_json = 14;
  optional int64 created_at_ms = 15;
  optional int64 ended_at_ms = 16;
  optional string parent_kind = 17;
  optional string span_id = 18;
}

message Span {
  string id = 1;
  optional string parent_span_id = 2;
  string kind = 3;
  optional string name = 4;
  optional string native_id = 5;
  optional string call_id = 6;
  optional string status = 7;
  optional int64 started_at_ms = 8;
  optional int64 ended_at_ms = 9;
  optional int64 start_event_idx = 10;
  optional int64 end_event_idx = 11;
  optional string data_json = 12;
}

message StatsRequest {}

message ListRequest {
  reserved 6;
  reserved "mode";
  uint32 limit = 1;
  optional string cursor = 2;
  optional string agent = 3;
  optional string cwd = 4;
  optional int64 since_ms = 5;
  optional string model = 7;
  optional string provider = 8;
  bool collapse_lineage = 9;
}

message ListResponse {
  repeated SessionSummary sessions = 1;
  optional string next_cursor = 2;
}

message SessionSummary {
  reserved 9;
  reserved "mode";
  string id = 1;
  string agent = 2;
  optional string cwd = 3;
  optional int64 started_at_ms = 4;
  optional int64 ended_at_ms = 5;
  optional string title = 6;
  optional string model = 7;
  optional string provider = 8;
  int64 events = 10;
  int64 ingested_at_ms = 11;
  optional string parent_session_id = 12;
  optional string parent_relation = 13;
  int64 subagent_count = 14;
  optional string status = 15;
  string fingerprint = 16;
  // Materialized at ingest; see references/architecture.md.
  int64 turns = 17;
  int64 tool_calls = 18;
  int64 errors = 19;
  // Absent when the producer reported no usage; a real zero is distinct.
  optional int64 input_tokens = 20;
  optional int64 output_tokens = 21;
  optional int64 total_tokens = 22;
}

message CoverageRequest { string id = 1; }

message CoverageResponse {
  optional SessionCoverage coverage = 1;
}

message SessionCoverage {
  reserved 4;
  reserved "mode";
  string id = 1;
  string fingerprint = 2;
  int64 ingested_at_ms = 3;
  int64 events = 5;
  int64 sources = 6;
  optional int64 latest_source_mtime_ns = 7;
  int64 source_bytes = 8;
}

message StatsResponse {
  reserved 4;
  reserved "total_full_sessions";
  string path = 1;
  int64 total_sessions = 2;
  int64 total_events = 3;
  repeated AgentStats agents = 5;
}

message AgentStats {
  reserved 4;
  reserved "full_sessions";
  string agent = 1;
  int64 sessions = 2;
  int64 events = 3;
}

message ReindexRequest {}

message ReindexResponse {}

message ReconstructRequest {
  string id = 1;
  string out_dir = 2;
  bool overwrite = 3;
}

message ReconstructResponse {
  repeated string paths = 1;
}
