[package]
name = "trace-db-tokenizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Release wrapper that builds the fts5-jieba SQLite extension shipped with TraceDB"
license = "MIT"
repository = "https://github.com/TSHOGX/trace-db"
publish = false

[lib]
# Keeps the artifact name libfts5jieba.{dylib,so} / fts5jieba.dll that the packaging and
# install scripts already expect.
name = "fts5jieba"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The tokenizer lives in its own repository. Cargo cannot emit a cdylib for a plain git
# dependency, so this crate exists only to re-export its extension entry points from a
# cdylib of our own. Pinned to a commit, not a branch, so a rebuild cannot change the
# tokenizer under an existing index.
tokenizer = { package = "fts5-jieba", git = "https://github.com/TSHOGX/fts5-jieba", rev = "c5ff1e2b007a261712aa259f14a1d5a1c931eba9" }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
