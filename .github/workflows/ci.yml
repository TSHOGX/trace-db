name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: python scripts/verify-release-version.py
      - run: python -m py_compile scripts/verify-release-version.py scripts/verify-release-package.py scripts/verify-sha256sums.py scripts/verify-opencode-compat.py
      - run: python tests/opencode_compat_script.py
      - run: python tests/release_artifacts.py
      - run: python scripts/generate-sbom.py --output target/tracedb-sbom.json
      - run: bash -n scripts/install-release.sh scripts/package-release.sh
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked -p fts5-jieba
      - name: Windows daemon smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $traceDb = Join-Path $pwd "target/debug/trace-db.exe"
          $root = Join-Path $env:RUNNER_TEMP "tracedb-daemon-native"
          $database = Join-Path $env:RUNNER_TEMP "tracedb-daemon.db"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          try {
            & $traceDb --db $database daemon install --interval 60 --root $root
            if ($LASTEXITCODE -ne 0) { throw "daemon install failed" }
            & $traceDb --db $database daemon status
            if ($LASTEXITCODE -ne 0) { throw "daemon status failed" }
            & $traceDb --db $database daemon stop
            if ($LASTEXITCODE -ne 0) { throw "daemon stop failed" }
            & $traceDb --db $database daemon start
            if ($LASTEXITCODE -ne 0) { throw "daemon start failed" }
          } finally {
            & $traceDb --db $database daemon uninstall
          }
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
      - run: cargo package --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --locked --workspace --all-targets

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: security
      - run: cargo install cargo-audit --locked --version 0.21.2
      - run: cargo audit --deny warnings
      - run: python scripts/generate-sbom.py --output target/tracedb-sbom.json

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          key: python
      - run: python -m pip install "maturin>=1.7,<2"
      - run: cargo clippy --locked -p tracedb-python --all-targets -- -D warnings
      - run: maturin build --release --locked --manifest-path bindings/python/Cargo.toml --out target/wheels
      - run: python scripts/smoke-python-wheel.py target/wheels/tracedb-*.whl

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
        with:
          key: node
      - run: cargo clippy --locked -p tracedb-node --all-targets -- -D warnings
      - run: npm --prefix bindings/node run build
      - run: npm --prefix bindings/node test
      - run: |
          package_version=$(node -p "require('./bindings/node/package.json').version")
          mkdir -p target/node-package
          npm pack ./bindings/node --pack-destination target/node-package
          node scripts/smoke-node-package.js "target/node-package/tracedb-core-${package_version}.tgz"

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo test --locked -p fts5-jieba
