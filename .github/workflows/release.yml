name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Verify release package versions
        run: python scripts/verify-release-version.py "${{ github.ref_name }}"
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }} -p trace-db -p fts5-jieba
      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: scripts/package-release.sh "${{ matrix.target }}" "${GITHUB_REF_NAME#v}" dist
      - name: Package Windows archive
        if: runner.os == 'Windows'
        run: |
          $Version = $env:GITHUB_REF_NAME.Substring(1)
          ./scripts/package-release.ps1 -Target "${{ matrix.target }}" -Version $Version -OutputDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: trace-db-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  bindings:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
        with:
          key: bindings-${{ matrix.target }}
      - name: Verify release package versions
        run: python scripts/verify-release-version.py "${{ github.ref_name }}"
      - name: Install maturin
        run: python -m pip install "maturin>=1.7,<2"
      - name: Build Python wheel
        run: maturin build --release --locked --target ${{ matrix.target }} --manifest-path bindings/python/Cargo.toml --out dist
      - name: Smoke test Python wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/tracedb-*.whl
          python bindings/python/smoke.py
          python scripts/verify-release-package.py dist/tracedb-*.whl --version "${GITHUB_REF_NAME#v}" --kind wheel
      - name: Build Node addon
        run: npm --prefix bindings/node run build
        env:
          TRACEDB_BUILD_TARGET: ${{ matrix.target }}
      - name: Smoke test Node addon
        run: npm --prefix bindings/node test
      - name: Package Node addon on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          Version="${GITHUB_REF_NAME#v}"
          npm pack ./bindings/node --pack-destination dist
          mv "dist/tracedb-core-${Version}.tgz" "dist/tracedb-core-${Version}-${{ matrix.target }}.tgz"
          python scripts/verify-release-package.py "dist/tracedb-core-${Version}-${{ matrix.target }}.tgz" --version "$Version" --kind npm
      - name: Package Node addon on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = $env:GITHUB_REF_NAME.Substring(1)
          npm pack ./bindings/node --pack-destination dist
          Move-Item "dist/tracedb-core-$Version.tgz" "dist/tracedb-core-$Version-${{ matrix.target }}.tgz"
          python scripts/verify-release-package.py "dist/tracedb-core-$Version-${{ matrix.target }}.tgz" --version $Version --kind npm
      - uses: actions/upload-artifact@v4
        with:
          name: trace-db-bindings-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: trace-db-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
