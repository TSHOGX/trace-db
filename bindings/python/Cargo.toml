[package]
name = "tracedb-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "Thin Python binding for the TraceDB Rust facade"
license = "MIT"

[lib]
name = "tracedb_python"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.27.1", features = ["abi3-py310", "extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracedb = { package = "trace-db", path = "../.." }
